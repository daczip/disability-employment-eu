on Employment (2025–2026) on how long the wage subsidy lasts; disability organisations say funding is insufficient and about 5,000 subsidised jobs could be at risk. Government proposal: recommend the 5% target to private firms with more than 25 staff as well."],"note":["2019 előtt a munkaképes korú fogyatékos emberek 4%-a dolgozott szociális vállalkozásban, 30 millió € támogatással; a nyílt piacon dolgozó 26% után 3 millió € támogatás járt. Frissebb adat (2026): a közszféra 2 362, legalább 25 fős szervezetéből 1 051 (44%) nem éri el az 5%-ot; a közszférában 13 629 fogyatékos ember dolgozik, a kvótához további 4 104 kellene.","Before 2019, 4% of working-age people with disabilities worked in social enterprises, with €30 million in support; the 26% working on the open market received €3 million. More recent data (2026): of 2,362 public bodies with at least 25 staff, 1,051 (44%) are below 5%; 13,629 people with disabilities work in the public sector, and 4,104 more would be needed to meet the quota."],"x":{"ws":"y","tr":"y","se":"y","ad":"y","buy":"x","st":"s","who":["A közszférabeli kvóta a megállapított fogyatékossággal élő munkavállalókra vonatkozik.","The public-sector quota applies to employees with an established disability."],"stn":["Törvényi alapú (foglalkoztatási törvény); 2025-ben a keret kisebb volt az igénynél.","Statutory (Law on Employment); in 2025 the budget fell short of demand."],"orgs":[["Užimtumo tarnyba","https://uzt.lt","Állami foglalkoztatási szolgálat: bértámogatás, munkahely-átalakítás, kísért foglalkoztatás.","Public employment service: wage subsidy, workplace adaptation, accompanied employment.","h"],["NDNT","https://ndnt.lrv.lt","A fogyatékosság és a munkaképesség (részvételi szint) megállapítása.","Assessment of disability and work capacity (participation level).","h"]]},"yrX":["EDE-jelentések (2022, 2024), DOTCOM (2025); kulcsadatok nemzeti forrásból (2025–2026)","EDE reports (2022, 2024), DOTCOM (2025); key figures from national sources (2025–2026)"],"kh":{"q":[["5%","csak közszféra (2024–2028)"],["5%","public sector only (2024–2028)"]],"t":[["25 fő",""],["25 employees",""]],"l":[["nincs","a kvótának nincs szankciója"],["none","the quota carries no sanction"]]},"trx":{"i":"p","d":"n","t":["A szociális műhelyek (socialinės dirbtuvės) értelmi és pszichoszociális fogyatékossággal élőknek fejlesztik a munkaképességet a nyílt piaci elhelyezkedés érdekében, azoknak, akik a támogatott foglalkoztatást még nem tudják igénybe venni. Átlépési adatot nem közölnek.","Social workshops (socialinės dirbtuvės) build work skills for people with intellectual and psychosocial disabilities with a view to open-market jobs, for those not yet able to use supported employment. No transition data are published."],"src":[["Joniškis: szociális szolgáltatási terv (2024) | Joniškis: social services plan (2024)","https://ftp.joniskis.lt/data/public/uploads/2024/05/240516_spp.pdf"]]}},"LU":{"m":"a","r":"B","q":["1 fő / 2% / 4% (magánszektor), 5% (közszféra)","1 person / 2% / 4% (private sector), 5% (public sector)"],"thr":["25 fő","25 employees"],"levy":["a szociális minimálbér 50%-a havonta hiányzó főnként; alig alkalmazzák","50% of the social minimum wage a month per missing worker; rarely applied"],"svc":["ADEM: a bruttó bér 40–100%-ának megtérítése és járulékátvállalás; inklúziós asszisztencia 2020 óta, amely gyakorlatilag nem működik.","ADEM: reimbursement of 40–100% of the gross wage plus employer contributions; inclusion assistance since 2020, which hardly functions in practice."],"shel":["Védett műhelyek (ateliers protégés): 1 456 fő, a foglalkoztatott fogyatékos lakosok 39%-a; a 25 év alattiaknál 73%.","Sheltered workshops (ateliers protégés): 1,456 people, 39% of employed residents with disabilities; 73% among those under 25."],"target":["Nincs.","None."],"prac":["A 25 fő feletti cégek 81,7%-a nem teljesíti a kvótát (2020).","81.7% of companies with more than 25 staff do not meet the quota (2020)."],"reform":["A kormány az elismerési idő rövidítése érdekében módosítja a 2003-as fogyatékosügyi törvényt (2026); a védett műhelyek bővítése és a kvóta alkalmazásának felülvizsgálata.","The government is amending the 2003 disability act to shorten the time needed to obtain worker-with-disability status (2026); expansion of sheltered workshops and a review of how the quota is applied."],"note":["Az észszerű alkalmazkodás csak a legalább 30%-os elismert fogyatékossághoz kötött, ami ütközhet az uniós joggal.","Reasonable accommodation is tied to a recognised disability of at least 30%, which may conflict with EU law."],"x":{"ws":"y","tr":"p","se":"p","ad":"y","buy":"n","st":"s","who":["Kvótába az elismert „salarié handicapé” státuszú munkavállaló számít (legalább 30%-os munkaképesség-csökkenés).","The quota counts employees with recognised “salarié handicapé” status (a reduction in work capacity of at least 30%)."],"stn":["Törvényi alapú, egyetlen országos szolgálattal (ADEM).","Statutory, with a single national service (ADEM)."],"orgs":[["ADEM","https://adem.public.lu","Foglalkoztatási ügynökség: a fogyatékos munkavállalói státusz és a bértámogatás.","Employment agency: disabled worker status and wage support.","h"],["Guichet.lu: salariés handicapés","https://guichet.public.lu/fr/entreprises/financement-aides/aides-emploi-recrutement-formation/aides-emploi/aide-embauche-travailleurs-handicapes.html","Kvóta, kompenzációs díj és állami bértámogatás munkáltatóknak.","Quota, compensation tax and state wage support for employers.","h"],["Info-Handicap","https://www.info-handicap.lu","Nemzeti fogyatékosügyi tanács: munkáltatói tanácsadás, munkaerő-piaci befogadás.","National disability council: advice for employers, labour market inclusion.","t"]]},"yrX":["EDE-jelentések (2022, 2024), DOTCOM (2025); kulcsadatok nemzeti forrásból (2025–2026)","EDE reports (2022, 2024), DOTCOM (2025); key figures from national sources (2025–2026)"],"kh":{"q":[["1 fő / 2% / 4%","magánszektor, létszám szerint; közszféra: 5%"],["1 person / 2% / 4%","private sector, by headcount; public sector: 5%"]],"t":[["25 fő",""],["25 employees",""]],"l":[["a szociális minimálbér 50%-a","havonta hiányzó főnként; alig alkalmazzák"],["50% of the social minimum wage","a month per missing worker; rarely applied"]]},"trx":{"i":"p","d":"n","t":["Az orientációs bizottság dönt arról, hogy a fogyatékos munkavállaló a nyílt piacra vagy védett műhelybe kerül, és a státuszt időszakonként felülvizsgálják, így elvben visszairányítás is lehetséges. A minisztérium 2024-es jelentése nem közöl átlépési adatot; a műhelyekben 2024 végén 1 435 teljes munkaidős egyenértéknyi fogyatékos munkavállaló dolgozott.","The orientation committee decides whether a disabled worker goes to the open market or to a sheltered workshop, and the status is reviewed periodically, so reorientation is possible in principle. The ministry’s 2024 report gives no transition data; at the end of 2024 the workshops employed 1,435 full-time equivalent disabled workers."],"src":[["Ministère du Travail: rapport d’activité 2024","https://gouvernement.lu/dam-assets/publications/rapport-activite/minist-travail-emploi/2024-rapport-activite/rapport-dactivit-2024.pdf"]]}},"HU":{"m":"a","r":"A","q":["5%","5%"],"thr":["25 fő felett","more than 25 employees"],"levy":["a minimálbér kilencszerese évente hiányzó főnként (2026: 2 905 200 Ft)","nine times the minimum wage a year per missing worker (2026: HUF 2,905,200)"],"svc":["Szociális hozzájárulási adókedvezmény a minimálbér kétszereséig (vállalkozói jogviszonyban is). Az akkreditált foglalkoztatók bér-, többletköltség- és képzési támogatását – az akkreditációval és az ellenőrzéssel együtt – a Budapest Főváros Kormányhivatala (BFKH) Rehabilitációs Főosztálya kezeli. A vármegyei kormányhivatalok rehabilitációs hatóságai végzik a komplex minősítést, és foglalkozási rehabilitációs szolgáltatást nyújtanak: egyéni és csoportos tanácsadás, rehabilitációs célú munkaközvetítés, munkaadói tanácsadás és érzékenyítés, valamint rehabilitációs mentori szolgáltatás. A mentort maga a hatóság foglalkoztatja (327/2011. Korm. rendelet 20. §): tájékoztat, segít az álláskeresésben és a munkahelyi beilleszkedésben, és tartja a kapcsolatot a munkáltatóval; 2024 májusa óta, ha a komplex minősítésben a foglalkozási rehabilitációs szakértő mentorálást javasol, a nem dolgozó ügyfél kérésére a hatóság mentort jelöl ki. Átképzés 2021 óta nem része a rehabilitációs szolgáltatásnak: támogatott képzésre csak az juthat, aki álláskeresőként regisztrál az állami foglalkoztatási szervnél, ami az ellátásban részesülőnek az ellátásról való lemondással jár. Az ellátásban részesülő 2021 óta kereseti korlát nélkül dolgozhat; évi öt nap pótszabadság jár. A hozzájárulás vásárlással nem váltható ki. Nyílt piaci bértámogatás: a TÁMOP-1.1.1 kiemelt projekt (2009–2015; a 2012–2015-ös szakasz 11,7 milliárd Ft-os kerettel) után az EFOP-1.1.1 projekt 2016–2022 között kb. 15 ezer megváltozott munkaképességű embert segített munkához, ebből közel 10 ezer támogatott foglalkoztatást finanszírozott; a 2022-es lezárás után célzott bértámogatás nem volt. 2025 óta a GINOP Plusz munkaerőpiaci programokban a szolgáltatást kérő megváltozott munkaképességű személyek is érdemben programrésztvevők (a bértámogatási hirdetmény szövege már 2024 májusától említi őket): a GINOP Plusz-3.1.1 a 30–64 évesek felvételéhez bértámogatást ad (a bruttó bér 50%-a, havi legfeljebb 300 000 Ft, 4–6 hónap), de csak gazdasági tevékenységet végző munkaadónak; a 15–29 évesek az Ifjúsági Garancia Plusz programban hátrányos helyzetűnek számítanak.","Social contribution tax relief up to twice the minimum wage (also for the self-employed). Wage, extra-cost and training subsidies for accredited employers – together with accreditation and inspection – are handled by the Rehabilitation Department of the Budapest Capital Government Office (BFKH). The rehabilitation authorities of the county government offices carry out the complex assessment and provide vocational rehabilitation services: individual and group counselling, placement, advice and awareness training for employers, and rehabilitation mentoring. The mentor is employed by the authority itself (Government Decree 327/2011, Section 20): they inform, help with job search and settling in at work, and keep in touch with the employer; since May 2024, if the vocational rehabilitation expert recommends mentoring in the complex assessment, the authority assigns a mentor to a client out of work who asks for one. Since 2021 retraining has not been part of the rehabilitation services: subsidised training is open only to people who register as jobseekers with the public employment service, which for benefit recipients means giving up the benefit. Since 2021 benefit recipients can work without an earnings limit; they get five extra days of annual leave. The levy cannot be offset by purchases. Open-market wage subsidy: after the TÁMOP-1.1.1 flagship project (2009–2015; its 2012–2015 phase with HUF 11.7 billion), the EFOP-1.1.1 project helped about 15,000 people with changed work capacity into work in 2016–2022, nearly 10,000 of them through subsidised employment; after it closed in 2022 there was no targeted wage subsidy. Since 2025 service seekers with changed work capacity have taken part in the GINOP Plus labour market programmes in practice (the wage subsidy notice has named them since May 2024): GINOP Plus-3.1.1 subsidises hiring people aged 30–64 (50% of the gross wage, at most HUF 300,000 a month, for 4–6 months), but only for employers engaged in economic activity; people aged 15–29 count as disadvantaged in the Youth Guarantee Plus programme."],"shel":["Akkreditált foglalkoztatás: tranzit (rehabilitálható) és tartós (rokkantsági kategóriájú) munkavállalóknak; 555 foglalkoztató, kb. 33 000 megváltozott munkaképességű munkavállaló (2023). Az akkreditációhoz legalább 30 fő vagy 25% feletti arány, rehabilitációs tanácsadó és mentor kell; a BFKH évente ellenőriz. Egy lépcsővel lejjebb a fejlesztő foglalkoztatás (2017 óta szociális szolgáltatás), két csatornán. Az állami ellátórendszerben a Szociális és Gyermekvédelmi Főigazgatóság (SZGYF) 46 fenntartott intézményben, 136 helyszínen 3 034 ellátottat foglalkoztat (2025), kb. háromnegyedüket fejlesztési jogviszonyban, negyedüket munkaviszonyban; a forrás az intézmények költségvetésébe épül. Emellett 2025-ben 160 nem állami szolgáltató kb. 3 700 főt foglalkoztatott az NSZI pályázatából (FF2024: 2024–2026, 2024-ben 5,4 milliárd Ft, óránként 1 453 Ft támogatás, a minimálbérrel emelkedik).","Accredited employment: transit places (for people who can be rehabilitated) and long-term places (for people in the disability categories); 555 employers and about 33,000 workers with changed work capacity (2023). Accreditation requires at least 30 such workers or more than 25% of staff, plus a rehabilitation adviser and a mentor; BFKH inspects every year. A step below is developmental employment (a social service since 2017), through two channels. In the state care system, the Directorate-General for Social Affairs and Child Protection (SZGYF) employs 3,034 clients in 46 of its institutions at 136 sites (2025), about three quarters under a developmental contract and a quarter under an employment contract, funded through the institutions’ budgets. In addition, 160 non-state providers employed about 3,700 people in 2025 with NSZI grant funding (FF2024: 2024–2026, HUF 5.4 billion in 2024, HUF 1,453 per hour of support, rising with the minimum wage)."],"target":["Nincs.","None."],"prac":["A kvótahelyek 65–70%-a betöltetlen (2018). A hozzájárulásból 2024-ben 185,8 milliárd Ft folyt be (2016-ban 65 milliárd Ft), ami kb. 77 ezer hiányzó főnek felel meg; a 2025-ös előirányzat 204,6 milliárd Ft.","65–70% of quota places are unfilled (2018). The levy brought in HUF 185.8 billion in 2024 (HUF 65 billion in 2016), equivalent to about 77,000 missing workers; the 2025 budget plans HUF 204.6 billion."],"reform":["A 2026 októberében benyújtott T/927. törvényjavaslat szerint 2027-től differenciált lesz a hozzájárulás. A kötelező szint (a létszám 5%-a, 25 fő felett) nem változik, de hiányzó főnként a minimálbér 9-szerese csak 25–249 fős létszámig marad; 250–499 fő: 11-szerese, 500–999 fő: 13-szorosa, legalább 1000 fő: 15-szöröse. Kétszeresen számítana a fogyatékossági támogatásban vagy vakok személyi járadékában részesülő, valamint a gyermekvédelmi gondoskodásból kikerült SNI-s vagy fogyatékossággal élő fiatal munkavállaló; a rehabilitációs mentor beszámítása változatlan. A T/932. javaslat a rokkantsági és rehabilitációs ellátás alapösszegét 2027-től 147 175 Ft-ról 162 000 Ft-ra emelné, 2028-tól a nyugdíjemeléshez igazítva.","Under bill T/927, submitted in October 2026, the levy would be differentiated from 2027. The mandatory level (5% of staff, above 25 employees) stays, but nine times the minimum wage per missing worker would apply only to employers with 25–249 staff; 250–499: eleven times, 500–999: thirteen times, 1,000 or more: fifteen times. Recipients of disability support or the blind persons’ allowance, and young people with special educational needs or disabilities leaving child protection care, would count twice; the counting of rehabilitation mentors stays unchanged. Bill T/932 would raise the base amount of disability and rehabilitation benefits from HUF 147,175 to HUF 162,000 from 2027, indexed to pension increases from 2028."],"note":["Az uniós projektek (EFOP-1.1.1, VEKOP-7.1.3) 2022-es lezárása óta a foglalkozási rehabilitációs szolgáltatásokra jutó forrás a korábbi töredéke: évente mintegy 60 ezer szolgáltatás hiányzik a rendszerből (csak az EFOP-1.1.1 hat év alatt 331 357 szolgáltatást nyújtott, évi kb. 55 ezret). Azóta a nyílt piaci szolgáltatást egyéves hazai pályázatok finanszírozzák, töredéknyi léptékben: a FOGLALKOZTATÁS2024 236 millió Ft-ból 16 szervezetet támogatott, 295 elhelyezés céllal. A mintegy 150 ezer inaktív megváltozott munkaképességű ember közül becslés szerint 30–60 ezernek lenne reális munkalehetősége megfelelő szolgáltatással (Daczi 2026). A szolgáltatási űrt részben piaci szereplők töltik ki: több profitorientált munkaerő-közvetítő és -kölcsönző cég (például a Trenkwalder, a Workforce, a Viapan és a Prohuman) rehabilitációs üzletágat működtet, kifejezetten azért, mert a hozzájárulás kiváltása erős munkáltatói keresletet teremt. Toboroznak, közvetítenek, kölcsönöznek, és a munkáltatók meglévő dolgozóinak rehabilitációs átvilágítását is kínálják. Az EFOP Plusz 4.1.1–4.1.3 felhívásokra 2025-re összesen 7,8 Mrd Ft keretet terveztek: a 4.1.2 (16–29 éves fogyatékos és SNI fiatalok munkatapasztalata, akkreditált foglalkoztatóknak) 2026 elején megnyílt, és 2026. november közepéig 17 szervezet 18 projektje összesen 2,21 milliárd Ft támogatást nyert (köztük a FŐNIX MMK, a MIREHAB, az Ösvény Esélynövelő Alapítvány, a Komló-Habilitas és az M-V Consulting), a 4.1.3 (elhelyezkedést segítő szolgáltatások) 2026 februárjában társadalmi egyeztetésen volt. A komplex minősítés hat kategóriája (B1–E) dönt arról, hogy valaki rehabilitációs vagy rokkantsági ellátást kap, és milyen foglalkoztatás felé indul. Nincs nemzeti foglalkoztatási cél, indikátor és rendszeres monitoring.","Since the EU projects (EFOP-1.1.1, VEKOP-7.1.3) closed in 2022, funding for vocational rehabilitation services has been a fraction of its earlier level: some 60,000 services a year are missing from the system (EFOP-1.1.1 alone delivered 331,357 services in six years, about 55,000 a year). Open-market services have since been funded only by one-year national grant calls, on a fraction of the earlier scale: FOGLALKOZTATÁS2024 supported 16 organisations with HUF 236 million, aiming at 295 placements. Of the roughly 150,000 inactive people with changed work capacity, an estimated 30,000–60,000 could realistically find work with suitable services (Daczi 2026). Market players partly fill the service gap: several for-profit recruitment and temporary work agencies (for example Trenkwalder, Workforce, Viapan and Prohuman) run rehabilitation business lines precisely because avoiding the levy creates strong employer demand. They recruit, place and lease workers, and also offer to screen employers’ existing staff for changed work capacity. HUF 7.8 billion was planned for the EFOP Plus 4.1.1–4.1.3 calls for 2025: 4.1.2 (work experience for young people aged 16–29 with disabilities or special educational needs, for accredited employers) opened in early 2026, and by mid-November 2026 18 projects of 17 organisations had won HUF 2.21 billion in total (among them FŐNIX MMK, MIREHAB, Ösvény Esélynövelő Alapítvány, Komló-Habilitas and M-V Consulting), and 4.1.3 (placement services) was in public consultation in February 2026. The six categories of the complex assessment (B1–E) decide whether a person receives a rehabilitation or a disability benefit and which type of employment they are steered towards. There is no national employment target, indicator or regular monitoring."],"x":{"ws":"p","tr":"y","se":"p","ad":"p","buy":"n","st":"m","who":["Kvótába számít, akinek egészségi állapota a komplex minősítés szerint legfeljebb 60%, aki legalább 40%-os egészségkárosodással vagy 50–100%-os munkaképesség-csökkenéssel rendelkezik, illetve fogyatékossági támogatásban vagy vakok személyi járadékában részesül, ha napi munkaideje legalább 4 óra. 2021 óta beszámít a volt sajátos nevelési igényű tanuló vagy fogyatékossággal élő hallgató is (legutoljára a 23. – 2026-tól a 26. – életév betöltésének évéig), valamint a képesített rehabilitációs mentor, a megváltozott munkaképességű létszámtól függően legfeljebb 1–12 fő.","The quota counts people whose health status is 60% or lower in the complex assessment, people with at least 40% health impairment or a 50–100% reduction in work capacity, and recipients of disability support or the blind persons’ allowance, if they work at least 4 hours a day. Since 2021 it also counts former pupils with special educational needs and students with disabilities (up to the year they turn 23, from 2026 the year they turn 26), and qualified rehabilitation mentors, at most 1–12 depending on the number of workers with changed work capacity."],"stn":["Állandó: a hozzájárulás, az adókedvezmény, a rehabilitációs hatósági szolgáltatások (benne a hatósági mentor), az akkreditált foglalkoztatás éves támogatási szerződéssel és a fejlesztő foglalkoztatás az SZGYF-intézményekben. Pályázati és időleges: a nem állami fejlesztő foglalkoztatás (évente), valamint a nyílt piaci szolgáltatások és bértámogatás. Utóbbiakat 2012–2022 között uniós projektek vitték (TÁMOP-1.1.1, EFOP-1.1.1, VEKOP-7.1.3); lezárásuk óta a szolgáltatást egyéves hazai pályázatok, 2026-tól az EFOP Plusz-4.1.2 projektjei, a bértámogatást 2025-től a GINOP Plusz általános munkaerőpiaci programjai pótolják részben.","Permanent: the levy, the tax relief, the rehabilitation authorities’ services (including the authority’s mentors), accredited employment through annual support contracts, and developmental employment in SZGYF institutions. Grant-based and temporary: non-state developmental employment (yearly calls) and open-market services and wage subsidies. EU projects carried the latter in 2012–2022 (TÁMOP-1.1.1, EFOP-1.1.1, VEKOP-7.1.3); since they closed, services rely on one-year national grant calls and, from 2026, EFOP Plus-4.1.2 projects, and wage subsidies have been partly replaced since 2025 by the general GINOP Plus labour market programmes."],"orgs":[["Érték Vagy! Portál","https://ertekvagy.hu","Állásportál, tudástár és kalkulátorok megváltozott munkaképességű embereknek és munkáltatóknak.","Job portal, knowledge base and calculators for people with changed work capacity and employers.","t"],["Rehabportál","https://rehabportal.hu","Online magazin és tudástár: komplex minősítés, ellátások, álláskeresés, munkáltatói tudnivalók.","Online magazine and knowledge base: complex assessment, benefits, job search, guidance for employers.","t"],["Kormányhivatalok","https://www.kormanyhivatalok.hu","Vármegyei rehabilitációs hatóságok: komplex minősítés, foglalkozási rehabilitációs szolgáltatások, hatósági rehabilitációs mentor.","County rehabilitation authorities: complex assessment, vocational rehabilitation services, the authority’s rehabilitation mentors.","h"],["BFKH Rehabilitációs Főosztály","https://kormanyhivatalok.hu/kormanyhivatalok/budapest/megye/szervezet/rehabilitacios-foosztaly","Az akkreditált foglalkoztatók és szolgáltatók akkreditációja, ellenőrzése és bértámogatása.","Accreditation, inspection and wage subsidies of accredited employers and service providers.","h"],["Nemzeti Foglalkoztatási Szolgálat","https://nfsz.munka.hu","Állami foglalkoztatási szolgálat: álláskereső-nyilvántartás, képzés, GINOP Plusz bértámogatás.","Public employment service: jobseeker registration, training, GINOP Plus wage subsidy.","h"],["SZGYF – fejlesztő foglalkoztatás","https://szgyf.gov.hu/szolgaltatasok/fejleszto-foglalkoztatas/foglalkoztato-intezmenyek-elerhetosegei/","Fejlesztő foglalkoztatás az állami szociális intézményekben; a foglalkoztató intézmények elérhetősége.","Developmental employment in state social care institutions; contact details of the institutions.","h"],["NSZI","https://nszi.hu","Pályázatok: fejlesztő foglalkoztatás, nyílt piaci szolgáltatások.","Grant calls: developmental employment, open-market services.","h"]]},"srcNote":["Szűcs D.–Daczi P. (szerk.) (2022): Rehabilitációs mentor képzés tananyag. NSZI, EFOP-1.1.1-15; Daczi P. (2024): könyvfejezet a Tanulmányok a gondoskodáspolitika témaköréből kötetben (PPKE BTK); Daczi P. (2025): Hazai pályázati források…, Gondoskodás 2025/1; Daczi P. (2026): Rendvédelem 2026/1","Szűcs D.–Daczi P. (eds.) (2022): Rehabilitation mentor training curriculum. NSZI, EFOP-1.1.1-15; Daczi P. (2024): chapter in Tanulmányok a gondoskodáspolitika témaköréből (PPKE BTK); Daczi P. (2025): national grant funding…, Gondoskodás 2025/1; Daczi P. (2026): Rendvédelem 2026/1"],"yrX":["Rehabilitációs mentor képzés tananyag (NSZI, 2022), Daczi (2024, 2025, 2026), nemzeti források (2024–2026), EDE-országjelentés (2024)","Rehabilitation mentor training curriculum (NSZI, 2022), Daczi (2024, 2025, 2026), national sources (2024–2026), EDE country report (2024)"],"kh":{"q":[["5%",""],["5%",""]],"t":[["25 fő felett",""],["more than 25 employees",""]],"l":[["2 905 200 Ft","évente hiányzó főnként: a minimálbér kilencszerese (2026)"],["HUF 2,905,200","a year per missing worker: nine times the minimum wage (2026)"]]},"trx":{"i":"p","d":"n","t":["Az akkreditált foglalkoztatásban a „tranzit” valójában támogatási kategória: a komplex minősítés szerint rehabilitálható, a nyugdíjkorhatártól még 5 évnél távolabb lévő dolgozó után jár, egyszer, legfeljebb 3 évig, időben csökkenő (100–90–80%-os) támogatással. A rendelet előír akciótervet és 6 hónapos mentori utókövetést, és meghatározza, mikor sikeres a kihelyezés, de kihelyezési célszámot, mutatót vagy szankciót sem a rendelet, sem a 2026-os támogatási szerződésminta nem tartalmaz. Daczi (2026) szerint a nyílt piaci átlépés azért ritka, mert hiányzik az állami koordináció és a munkáltatói érdekeltség. A szerződés inkább a létszám megtartására ösztönöz, mert ha a foglalkoztatott létszám a vállalt alá csökken, a támogatás is csökken. A kihelyezést a legfeljebb 4 hónapos munkapróba segítette, de ezt 2020. január 1-jén kivették a rendeletből. A hatóság 2019-es kimutatása szerint 2015 második fele és 2019 első fele között évente csak néhány tucat–kb. kétszáz tranzit utáni elhelyezkedés és munkapróba volt; azóta az akkreditált foglalkoztatásból való kilépésről nincs közölt adat, így mért eredmény sincs. A fejlesztő foglalkoztatásból a nyílt munkaerőpiacra továbblépők számát közlik (2023-ban 169 fő), de az szociális szolgáltatás, nem a védett foglalkoztatásból való átvezetés mérése.","In accredited employment, “transit” is in practice a support category: it applies to a worker assessed as rehabilitable who is more than five years from pension age, once, for up to three years, with support falling over time (100%, 90%, 80%). The decree requires an action plan and six months of mentor follow-up, and defines when a placement counts as successful, but neither the decree nor the 2026 support contract template sets any placement target, indicator or sanction. According to Daczi (2026), moves to the open labour market are rare because state coordination and employer incentives are missing. The contract rather rewards keeping staff, because support falls if headcount drops below the contracted level. Placements were supported by a work trial of up to four months, but it was removed from the decree on 1 January 2020. According to the authority’s 2019 report, between the second half of 2015 and the first half of 2019 there were only a few dozen to about two hundred placements after transit employment and work trials a year; nothing has been published on exits from accredited employment since, so there is no measured result. Progression from developmental employment to the open labour market is reported (169 people in 2023), but that is a social service, not a measure of transition out of sheltered employment."],"src":[["SZGYF: Foglalkozási rehabilitációs kimutatás, 2019. I. félév | SZGYF: occupational rehabilitation report, H1 2019","https://szocialisportal.hu/wp-content/uploads/2017/07/190905_K_00_29_FoglrehabkimutatasRH_2019elsofelev.pdf"],["Kormányhivatal: Tájékoztató a rehabilitációs tervekhez (2023) | Government Office: guidance on rehabilitation plans (2023)","https://www.kormanyhivatalok.hu/sites/default/files/2023-07/tajekoztato-a-rehabilitacios-tervekhez.docx"],["FSZK: A foglalkozási rehabilitáció fogalomgyűjteménye (2017) | FSZK: glossary of occupational rehabilitation (2017)","https://www.efiportal.hu/wp-content/uploads/2023/05/A_foglalkozasi_rehabilitacio_fogalomgyutemenye_v.pdf"],["327/2012. (XI. 16.) Korm. rendelet | Government Decree 327/2012","ht  suspended between 2019 and 2022."],"reform":["2025 augusztusa óta harmadik országbeli munkavállalót csak az a munkáltató vehet fel, amely teljesíti a 2%-os kvótát vagy befizeti a hozzájárulást.","Since August 2025 employers may hire third-country nationals only if they meet the 2% quota or pay the contribution."],"note":["Egyes munkáltatók alacsony képzettséget igénylő, rosszul fizető állásokkal kerülik el a befizetést. 2025 márciusában 5 393 fogyatékos ember dolgozott, hat év alatt 1 730-cal több.","Some employers avoid the levy through low-skilled, poorly paid jobs. In March 2025, 5,393 people with disabilities were in work, 1,730 more than six years earlier."],"x":{"ws":"y","tr":"y","se":"y","ad":"y","buy":"n","st":"m","who":["Kvótába a Jobsplusnál fogyatékos személyként nyilvántartott munkavállaló számít.","The quota counts employees registered with Jobsplus as persons with disability."],"stn":["A Jobsplus és a Lino Spiteri Alapítvány állandó; az Access to Employment bértámogatás uniós forrású.","Jobsplus and the Lino Spiteri Foundation are permanent; the Access to Employment subsidy is EU-funded."],"orgs":[["Jobsplus: employing a person with disability","https://jobsplus.gov.mt/find-candidates/employing-a-person-with-disability","Kvóta, hozzájárulás és az Access to Employment bértámogatás.","Quota, contribution and the Access to Employment wage subsidy.","h"],["Lino Spiteri Foundation","https://linospiterifoundation.org","Job coaching, toborzás és utókövetés munkáltatóknak és munkavállalóknak.","Job coaching, recruitment and follow-up for employers and workers.","t"]]},"yrX":["EDE-jelentések (2022, 2024), DOTCOM (2025); kulcsadatok nemzeti forrásból (2025–2026)","EDE reports (2022, 2024), DOTCOM (2025); key figures from national sources (2025–2026)"],"kh":{"q":[["2%",""],["2%",""]],"t":[["20 fő felett",""],["more than 20 employees",""]],"l":[["2 400 €","évente hiányzó főnként, legfeljebb 10 000 €"],["€2,400","a year per missing worker, up to €10,000"]]},"trx": abb bért és a műhelyi nyugdíjelőny megtarthatóságát célozza.","Fewer than 1% a year leave the workshops for the open labour market. The targeted instrument is the budget for work (Budget für Arbeit, 2018): a wage subsidy and support for people entitled to a workshop place who take an open-market job. The 2024 federal action plan aims at more transitions, higher pay and keeping the workshop pension advantage."],"src":[]}},"IT":{"m":"a","r":"A","q":["1 fő / 2 fő / 7%","1 person / 2 people / 7%"],"thr":["15 fő","15 employees"],"levy":["részleges felmentésnél 39,21 € naponta nem foglalkoztatott személyenként (2027-től 44,32 €)","with partial exemption, €39.21 a day per person not employed (€44.32 from 2027)"],"svc":["Célzott elhelyezés (collocamento mirato); járulékkedvezmények; INAIL-alap a munkahelyi baleset utáni visszatéréshez; regionális programok.","Targeted placement (collocamento mirato); contribution relief; the INAIL fund for return to work after an accident; regional programmes."],"shel":["B típusú szociális szövetkezetek; megállapodással megrendelés adható nekik a kvóta terhére. Létszámadat az EDE-jelentésben nincs.","Type B social cooperatives; by agreement, orders placed with them count towards the quota. The EDE report gives no figures."],"target":["Nincs.","None."],"prac":["Az EDE-jelentés nem közöl adatot.","The EDE report gives no data."],"reform":["Új országos adatbázis a célzott elhelyezéshez; a fogyatékos személyek jogainak nemzeti hatósága (2024).","A new national database for targeted placement; a national authority for the rights of persons with disabilities (2024)."],"note":["Az EDE-jelentés szerint nincs napirenden a nyílt munkaerőpiacot érintő reformjavaslat.","According to the EDE report, no reform proposal for the open labour market is on the agenda."],"x":{"ws":"y","tr":"y","se":"p","ad":"y","buy":"p","st":"s","who":["Kvótába jellemzően a 45% feletti polgári rokkantságú, illetve a 33% feletti munkabaleseti rokkantságú személyek számítanak ( isations; bill L387/2026 would further narrow the protected units eligible for purchases (about 2,000 people with disabilities work in the system). A reassessment of the quota is uncertain."],"note":["A vásárlásos kiváltást 2017-ben megszüntették, mert sok védett egység egyetlen fogyatékos munkavállalóval működött; később részben visszaállították.","The purchase option was abolished in 2017 because many protected units operated with a single worker with disabilities; it was later partly restored."],"x":{"ws":"p","tr":"p","se":"n","ad":"p","buy":"p","st":"m","who":["Kvótába a fogyatékossági fokozatot igazoló tanúsítvánnyal rendelkező munkavállaló számít.","The quota counts employees holding a certificate of their degree of disability."],"stn":["Kevés a célzott szolgáltatás: az állami szakképzésben 2024-ben 24 fogyatékos ember vett részt; a bővítés uniós projektekből megy.","Targeted services are scarce: 24 persons with disabilities took part in state vocational training in 2024; expansion relies on EU projects."],"orgs":[["ANOFM","https://www.anofm.ro","Állami foglalkoztatási ügynökség; a kvótajelentések egyik címzettje.","National employment agency; one recipient of quota reports.","h"],["ANPDPD","https://anpd.gov.ro","Fogyatékosügyi hatóság: védett egységek nyilvántartása, kvóta-eljárás.","Disability authority: register of protected units, quota procedures.","h"]]},"kh":{"q":[["4%",""],["4%",""]],"t":[["50 fő",""],["50 employees",""]],"l":[["a bruttó minimálbér","havonta hiányzó főnként, vagy legalább 50% befizetés és vásárlás védett egységtől"],["the gross minimum wage","a month per missing worker, or at least 50% paid plus purchases from a protected unit"]]},"trx":{"i":"n","d":"n","t":["Célzott átvezető eszközről és átlépési adatról nincs információ. 2026. április 1-jén 459 engedélyezett védett egység működött kb. 3 050 dolgozóval, köztük mintegy 2 011 fogyatékos személlyel; egy 2026-os törvényjavaslat szigorítaná a feltételeiket.","No targeted transition instrument or transition data was found. On 1 April 2026 there were 459 authorised protected units with about 3,050 employees, around 2,011 of them persons with disabilities; a 2026 bill would tighten the conditions for them."],"src":[["StartupCafe: védett egységek (2026) | StartupCafe: protected units (2026)","https://startupcafe.ro/firmele-cu-minimum-50-de-angajati-ar-putea-vira-mai-multi-bani-direct-la-stat-proiectul-care-schimba-regulile-pentru-unitatile-protejate-107201"]]}},"ES":{"m":"b","r":"A","q":["2%; közszféra 7%","2%; public sector 7%"],"thr":["50 fő","50 employees"],"levy":["alternatív intézkedések (évente legalább 3 × IPREM hiányzó főnként)","alternative measures (at least 3 × IPREM a year per missing worker)"],"svc":["Támogatott foglalkoztatás munkahelyi felkészítőkkel (empleo con apoyo); járulékkedvezmények. Alternatív teljesítés: szerződés különleges foglalkoztatási központtal, adomány vagy munkaenklávé.","Supported employment with job coaches (empleo con apoyo); contribution relief. Alternative compliance: a contract with a special employment centre, a donation or a work enclave."],"shel":["Különleges foglalkoztatási központok (CEE) minimálbérrel: 98 551 fő (2021). A fogyatékos személyeknek szóló speciális szerződések 71%-át itt kötik.","Special employment centres (CEE) paying the minimum wage: 98,551 people (2021). 71% of the dedicated contracts for persons with disabilities are signed here."],"target":["Foglalkoztatási és aktivitási ráta 34,3%-ról 51%-ra 2030-ig.","Employment and activity rates from 34.3% to 51% by 2030."],"prac":["A kötelezett cégek 60,2%-a nem teljesítette a kvótát (2021).","60.2% of obliged companies did not meet the quota (2021)."],"reform":["Fehér Könyv (2023): 4%-os kvóta, 25 fős küszöb. 2026 júliusában a Képviselőház illetékes bizottsága elfogadta a törvényjavaslatot, amely a kvóta megszegését súlyosról nagyon súlyos szabálysértésre emeli, és kizárja a szankcionált cégeket a támogatásokból; a szenátusi elfogadásról nem találtunk adatot.","White Paper (2023): raise the quota to 4%, lower the threshold to 25 staff. In July 2026 the competent committee of the Congress passed a bill that raises a breach of the quota from a serious to a very serious offence and bars sanctioned companies from subsidies; we found no record yet of its passage in the Senate."],"note":["A központok nyereségkényszere miatt főként enyhébb fogyatékosságú munkavállalókat vesznek fel.","Because the centres must be profitable, they mostly hire workers with milder disabilities."],"x":{"ws":"y","tr":"y","se":"y","ad":"y","buy":"y","st":"s","who":["Kvótába a legalább 33%-os elismert fogyatékossági fokú munkavállaló számít.","The quota counts employees with a recognised degree of disability of at least 33%."],"stn":["Törvényi alapú; a végrehajtás az autonóm közösségeknél van, ezért a kínálat területenként eltér.","Statutory; implemented by the autonomous communities, so provision varies by region."],"orgs":[["SEPE","https://www.sepe.es","Állami foglalkoztatási szolgálat.","Public employment service.","h"],["Por Talento","https://www.portalento.es","A Fundación ONCE (Inserta Empleo) állás- és képzési portálja fogyatékos embereknek, munkáltatói szolgáltatással.","Fundación ONCE (Inserta Empleo) job and training portal for people with disabilities, with services for employers.","t"],["Comunidad de Madrid: cuota de reserva","https://www.comunidad.madrid/empleo/cuota-reserva-2-personas-discapacidad","Gyakorlati útmutató a 2%-os kvótáról és az alternatív intézkedésekről.","Practical guide to the 2% quota and alternative measures.","h"]]},"kh":{"q":[["2%","közszféra: 7%"],["2%","public sector: 7%"]],"t":[["50 fő",""],["50 employees",""]],"l":[["alternatív intézkedések","évente legalább 3 × IPREM hiányzó főnként"],["alternative measures","at least 3 × IPREM a year per missing worker"]]},"trx":{"i":"y","d":"n","t":["A munkaenklávé (enclave laboral, 290/2004. királyi rendelet) kifejezetten átvezető eszköz: a különleges foglalkoztatási központ legalább háromfős csoportot helyez ki egy rendes cégbe 3 hónaptól 3 évig, és a meghosszabbításhoz 1–2 főt a cégnek fel kell vennie. Az EDE-szintézis szerint a központok támogatása inkább csökkenti az átlépést. Országos arány nincs.","The labour enclave (enclave laboral, Royal Decree 290/2004) is a dedicated transition tool: a special employment centre places a group of at least three workers in an ordinary company for three months to three years, and an extension requires the company to hire one or two of them. The EDE synthesis finds that subsidies to the centres tend to reduce transitions. There is no national rate."],"src":[["EDE (2025): szintézisjelentés | EDE (2025): synthesis report","https://data.europa.eu/doi/10.2767/7015422"],["EASPD: Good practices to open labour market","https://disabilitysupport.eu/fileadmin/user_upload/Good_practices_to_open_labour_market.pdf"]]}},"SE":{"m":"c","r":"A","q":["nincs, és soha nem volt","none, and there never was one"],"thr":["–","–"],"levy":["–","–"],"svc":["Bértámogatás (lönebidrag); SIUS támogatott foglalkoztatás az állami foglalkoztatási szolgálat konzulenseivel; munkahely-átalakítás.","Wage subsidy (lönebidrag); SIUS supported employment with the public employment service’s own consultants; workplace adaptation."],"shel":["Samhall állami vállalat: kb. 24 000 fogyatékos munkavállaló (2023). Az éves cél 1 500 fő átlépése más munkáltatóhoz; 2022-ben 1 483 fő lépett át.","The state company Samhall: about 24,000 workers with disabilities (2023). The annual goal is 1,500 transitions to other employers; 1,483 moved on in 2022."],"target":["Nincs.","None."],"prac":["Nincs kvóta.","No quota."],"reform":["Állami vizsgálat (SOU 2025:29): a Samhall védett munkaóráinak célszáma 2026-ban 789 000-rel, 2027-től évente 1,58 millióval csökkenne a 2025-ös szinthez képest, miközben több út nyílna a védett munkához.","Government inquiry (SOU 2025:29): the target for paid hours of sheltered work at Samhall would fall by 789,000 in 2026 and by 1.58 million a year from 2027 compared with 2025, while more routes to sheltered work would open."],"note":["A munkaügyi szolgálat évek óta nem költi el teljes fogyatékosügyi keretét; a Számvevőszék (2025) szerint a szolgálatnál azonosított, munkaképességet csökkentő fogyatékossággal élők felének nincs tartós támogatása. A 2022-es definícióváltás megtöri a foglalkoztatási különbség hazai idősorát.","For years the employment service has not spent its full disability budget; the National Audit Office (2025) found that half of the people it has identified with a work-limiting disability get no lasting support. A change of definition in 2022 breaks the national time series of the employment gap."],"x":{"ws":"y","tr":"y","se":"y","ad":"y","buy":"x","st":"s","who":["Nincs kvóta; a támogatásokhoz a foglalkoztatási szolgálat állapítja meg a munkaképességet csökkentő funkciócsökkenést.","No quota; for support, the employment service establishes an impairment that reduces work capacity."],"stn":["Törvényi alapú, az állami foglalkoztatási szolgálat nyújtja.","Statutory, delivered by the public employment service."],"orgs":[["Arbetsförmedlingen","https://arbetsformedlingen.se","Állami foglalkoztatási szolgálat: bértámogatás (lönebidrag), SIUS.","Public employment service: wage subsidy (lönebidrag), SIUS.","h"],["Samhall","https://samhall.se","Állami cég védett foglalkoztatásra és átvezetésre.","State company for sheltered employment and transition.","t"],["MFD","https://www.mfd.se","Fogyatékosügyi tudásügynökség: elemzések, köztük a munkaerőpiacról.","Swedish Agency for Participation: analyses, including on the labour market.","h"]]},"kh":{"q":[["nincs","és soha nem volt"],["none","and there never was one"]],"t":[["–",""],["–",""]],"l":[["–",""],["–",""]]},"trx":{"i":"y","d":"y","t":["A Samhall éves célja 1 500 dolgozó átlépése más munkáltatóhoz: 2022-ben 1 483, 2023-ban 1 166 fő lépett át, így a célt nem érték el. A bértámogatás a leghatásosabb eszköz, de bennragadási hatást is okoz; a nappali tevékenységből (LSS) kevesen lépnek tovább.","Samhall’s annual target is 1,500 employees moving to other employers: 1,483 moved in 2022 and 1,166 in 2023, missing the target. Wage subsidies are the most effective tool but also cause lock-in; few people move on from daily activities (LSS)."],"src":[["EDE (2025): szintézisjelentés | EDE (2025): synthesis report","https://data.europa.eu/doi/10.2767/7015422"]]}},"SK":{"m":"a","r":"A","q":["3,2%","3.2%"],"thr":["20 fő","20 employees"],"levy":["az országos átlagbér munkaerőköltségének 0,9-szerese hiányzó főnként","0.9 times the labour cost of the national average wage per missing worker"],"svc":["A kvóta megrendeléssel is teljesíthető védett műhelytől, integrációs szociális vállalkozástól vagy fogyatékos önfoglalkoztatótól; feleződő egészségbiztosítási járulék.","The quota can also be met by ordering from a sheltered workshop, an integrative social enterprise or a self-employed person with disabilities; halved health insurance contributions."],"shel":["Védett műhelyek: 7 822 fő (2022; 2013-ban 16 102). Integrációs szociális vállalkozások kb. 3 900 fogyatékos munkavállalóval.","Sheltered workshops: 7,822 people (2022; 16,102 in 2013). Integrative social enterprises with about 3,900 workers with disabilities."],"target":["Csak annyi, hogy a fogyatékos álláskeresők aránya 3% alatt legyen.","Only that jobseekers with disabilities stay below 3% of all registered jobseekers."],"prac":["Az EDE-jelentés nem közöl teljesítési arányt.","The EDE report gives no compliance rate."],"reform":["Nagyobb reform nincs; a szociális vállalkozási törvény módosítása 2026-ban kerül a parlament elé.","No major reform; an amendment to the social enterprise act goes to parliament in 2026."],"note":["Új védett műhely létesítésére 2020 óta nincs támogatás; a támogatott foglalkoztatásnak nincs tartós közfinanszírozása.","No support for setting up new sheltered workshops since 2020; supported employment has no stable public funding."],"x":{"ws":"p","tr":"y","se":"p","ad":"p","buy":"y","st":"m","who":["Kvótába a legalább 40%-os munkaképesség-csökkenésű munkavállaló számít; a 70% felettiek háromszorosan.","The quota counts employees with a reduction in work capacity of at least 40%; those above 70% count three times."],"stn":["A hozzájárulások törvényi alapúak; a támogatott foglalkoztatásnak nincs tartós finanszírozása.","Allowances are statutory; supported employment has no stable funding."],"orgs":[["ÚPSVaR","https://www.upsvr.gov.sk","Munkaügyi hivatal: kvóta, védett műhelyek, támogatások.","Labour office: quota, sheltered workshops, subsidies.","h"],["MPSVR: sociálna ekonomika","https://www.employment.gov.sk/sk/praca-zamestnanost/socialna-ekonomika/","A szociális (köztük integrációs) vállalkozások szabályai és nyilvántartása.","Rules and register of social enterprises, including work integration enterprises.","h"]]},"kh":{"q":[["3,2%",""],["3.2%",""]],"t":[["20 fő",""],["20 employees",""]],"l":[["0,9 × átlagos bérköltség","az országos átlagbér munkaerőköltségének 0,9-szerese hiányzó főnként"],["0.9 × average labour cost","0.9 times the labour cost of the national average wage per missing worker"]]},"trx":{"i":"y","d":"y","t":["Kihelyezési támogatás jár a szociális vállalkozásnak, ha fogyatékos dolgozója két éven belül nyílt piaci állásba lép, és ott marad (havi támogatás legfeljebb 12 hónapig). Alig használják: 2020 végéig két vállalkozás kapta meg, 2022-ben öt dolgozó után fizették ki.","A placement allowance is paid to a social enterprise if a disabled employee moves to an open-market job within two years and keeps it (a monthly payment for up to 12 months). It is hardly used: by the end of 2020 two enterprises had received it, and in 2022 it was paid for five employees."],"src":[]}},"SI":{"m":"a","r":"A","q":["2–6% ágazat szerint","2–6% depending on the sector"],"thr":["20 fő","20 employees"],"levy":["a minimálbér 70%-a havonta hiányzó főnként","70% of the minimum wage a month pe   mx_p:'Öt gyakorlati kérdés minden országra: van-e bértámogatás, rehabilitációs és képzési program, támogatott foglalkoztatás, munkahely-átalakítási támogatás, és kiváltható-e a hozzájárulás vásárlással. Az utolsó oszlop azt mutatja, állandó-e a rendszer, vagy időszakos projektekre épül.',

  fi_h:'Fő megállapítások',fi_p:'Amit a 27 profil együtt mutat.',
  finds:[
    ['A hozzájárulás mértéke nagyságrendekkel eltér.','Egy hiányzó főre havonta a minimálbér 20%-a Horvátországban, 30%-a Bulgáriában, 70%-a Szlovéniában, 100%-a Romániában. Magyarországon évi kilencszeres minimálbér, Lengyelországban az átlagbér 40,65%-a havonta.'],
    ['A hozzájárulás a legtöbb kvótás országban vásárlással kiváltható.','Védett műhelytől vagy szociális vállalkozástól való megrendeléssel Bulgáriában, Csehországban, Németországban, Spanyolországban, Franciaországban, Horvátországban, Lengyelországban, Szlovéniában és Szlovákiában, Romániában a hozzájárulás feléig. Magyarországon nincs ilyen lehetőség.'],
    ['A kvótát kevesen teljesítik.','Ausztriában a kötelezett munkáltatók 22%-a, Luxemburgban 18%-a, Spanyolországban 40%-a teljesít; Magyarországon a kvótahelyek 30–35%-a van betöltve. A szankció nélküli kvóták gyakorlatilag nem hatnak.'],
    ['A védett foglalkoztatásban a jogállás a választóvonal.','Munkavállalói státusz és minimálbér jár Spanyolországban, Hollandiában, Flandriában, Svédországban és Szlovéniában. Munkaszerződés nélkül dolgoznak az osztrák tartományi műhelyekben, a német WfbM-ben és a francia ESAT-ban.'],
    ['A védett műhelyekből kevesen lépnek a nyílt munkaerőpiacra.','Ausztriában 0,7%, Németországban 1% alatt, a lengyel terápiás műhelyekből és az észt hosszú távú védett munkából 2% vagy kevesebb. A kifejezetten átmenetre tervezett programok jobbak, de a céljuktól elmaradnak: Franciaországban 3,6–7,7% a 30%-os célhoz képest, az észt rövid távú szolgáltatásból kb. 20%.'],
    ['Kevés ország méri magát a foglalkoztatási rátán.','Mintegy 15 országban van vagy volt valamilyen számszerű cél. Érvényes, a fogyatékos emberek foglalkoztatási vagy aktivitási rátájára, illetve a különbségre szóló célja Belgiumnak, Lettországnak, Lengyelországnak, Romániának, Spanyolországnak és (helyezésként) Portugáliának van; az ír cél 2024-ben lejárt, a litvánt törölték. A többi ország szűkebb csoportot vagy más mutatót követ. Magyarországon nincs cél.'],
    ['A bértámogatás hatása kevéssé igazolt.','A kvóta nélküli országokban ez a fő eszköz, de ahol készült értékelés (Finnország, Lettország, Dánia), a hatás szerény vagy nem kimutatható.'],
    ['A munkahely-átalakítási támogatást alig veszik igénybe.','Évi 13–16 eset Észtországban, 125 munkahely Litvániában (2021), 37 kérelem Írországban (2019).']
  ],
  me_h:'Források és megbízhatóság',
  me:[
    '<p><b>Régiók.</b> A régiószűrő az EU Kiadóhivatalának EuroVoc-tezauruszát követi: Közép- és Kelet-Európa (BG, CZ, HR, HU, PL, RO, SI, SK), Észak-Európa (DK, EE, FI, LT, LV, SE), Nyugat-Európa (AT, BE, DE, FR, IE, LU, NL), Dél-Európa (CY, EL, ES, IT, MT, PT). Az ENSZ M49-es besorolása ettől eltér: Horvátországot és Szlovéniát Dél-, Írországot Észak-Európába, Ciprust Nyugat-Ázsiába sorolja.</p>',
    '<p><b>Két forrásszint.</b> A „friss nemzeti forrásból ellenőrizve” jelölésű 15 országnál a fő állításokat 2024–2026-os nemzeti vagy szakmai forrásból ellenőriztük. A többi 12 országnál a profil az EDE-hálózat 2022-es és 2024-es országjelentéseire és a Bizottság DOTCOM-adatbázisának 2025. októberi állapotára épül; ezeknél 2026 novemberében a kulcsadatokat (bértámogatás, kvóta, friss reformok) nemzeti forrásból ellenőriztük és frissítettük, ezt a blokkok alatti forráscímke jelzi.</p><p><b>Egységes réteg.</b> A kvóta gyakorlati teljesülése és a nemzeti cél mind a 27 országnál az EDE 2024-es országjelentéséből származik (2024. novemberi állapot), ezért egymással összevethetők. A tervezett reformoknál és a megjegyzéseknél a frissebb nemzeti adat elsőbbséget kap.</p>',
    '<p><b>Átlépés a nyílt munkaerőpiacra.</b> A blokk két kérdésre felel: van-e kifejezetten a védett foglalkoztatásból kivezető eszköz (például átmeneti szerződés, kihelyezési támogatás, visszatérési jog), és közölnek-e mért eredményt. Az arányok nem vethetők össze közvetlenül: van, ahol a teljes állomány éves kilépését (AT, DE), van, ahol egy program végén elhelyezkedők arányát (EE, FR, MT), és van, ahol létszámot (SE, SK) mérnek. A magyar „tranzitfoglalkoztatás” jogi kategória, nem a ténylegesen megvalósult átlépés mértéke. A „nem ismert” jelölés azt jelenti, hogy sem az EDE-jelentésben, sem a 2026. novemberi nemzeti forráskutatásban nem találtunk ilyen eszközt.</p>',
    '<p><b>Amit érdemes szem előtt tartani.</b> A hozzájárulások és a támogatások összege évente változik. A „védett foglalkoztatás” országonként más intézményt jelent (terápiás műhely, védett vállalat, akkreditált foglalkoztató, szociális vállalkozás), ezért a létszámok nagyságrendet jeleznek. Ahol a források ellentmondanak egymásnak, a profil „ellenőrzés alatt” jelzést kap.</p><p><b>Gyakorlati réteg.</b> A „Mi érhető el ebben az országban?” lista, a „Mi érhető el hol?” tábla és a stabilitási besorolás saját összegzés a DOTCOM-adatbázis (közfoglalkoztatási szolgálatok, munkahely-átalakítás, pénzügyi ösztönzők; 2025. október) és az EDE-jelentések alapján. A „Hová forduljon” honlapok elérhetőségét 2026. november 15–17. között ellenőriztük. A kvótába számító kör leírása tájékoztató összefoglaló, nem jogi tanács.</p><p>A profilok állapota: {UPD}. Ez saját összeállítás, nem hivatalos jogi tájékoztatás.</p>'
  ],
  foot:'<b>Összehasonlító források:</b><ul>'+
    '<li><a href="https://data.europa.eu/doi/10.2767/7015422">EDE (2025): Employment of persons with disabilities, szintézisjelentés</a> és a 27 országjelentés (2024. novemberi állapot)</li>'+
    '<li><a href="https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/disability/european-disability-expertise-ede/dotcom-search_en">Európai Bizottság: DOTCOM-adatbázis</a>, foglalkoztatási témák (2025. októberi állapot)</li>'+
    '<li><a href="https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/disability/european-disability-expertise-ede/reports_en">EDE-jelentések gyűjtőoldala</a></li>'+
    '<li><a href="https://assets.eurofound.europa.eu/f/279033/233e9e60f4/ef20013en.pdf">Eurofound (2021): Disability and labour market integration</a></li>'+
    '<li><a href="https://disabilitysupport.eu/fileadmin/user_upload/Publications/Fostering_Employment_through_Sheltered_Workshops_Reality__Trends_and_Next_Steps_2.pdf">EASPD (2022): Fostering Employment through Sheltered Workshops</a></li></ul>'
},

  title:'Country profiles: disability and employment in Europe',

  lead:'Quota and levy, services, sheltered employment, targets and reforms: a short, sourced profile for each country, in a structure that lets you compare them.',

  mx_p:'Five practical questions for every country: is there a wage subsidy, a rehabilitation and training programme, supported employment, a workplace adaptation grant, and can the levy be offset by purchases. The last column shows whether the system is permanent or built on temporary projects.',
  mx_n:'“Partly”: the tool is available only to a narrow group, as a pilot, as a plan or in periodic calls. The classification is our own summary of the DOTCOM database and the EDE reports; details are in each country profile.',
  src_h:'Sources for this country',src_ede:'EDE country report 2024 (PDF)',ede22:'EDE country report 2022',
  tb_h:'Comparison',
  tb_p:function(n,m){return m?n+' countries in the selected filter ('+m+'). Change the filter in the top bar.':'All '+n+' member states in one table. Use the top bar to filter by model and region.';},
  tb_hint:'Click a row for the country’s profile.',
  srt:'Sort',s_n:'Country',s_m:'Model',
  th:['Country','Model','Quota','Threshold','Levy','National target','Source level'],
  fi_h:'Main findings',fi_p:'What the 27 profiles show together.',
  finds:[
    ['The size of the levy differs by orders of magnitude.','Per missing worker each month it is 20% of the minimum wage in Croatia, 30% in Bulgaria, 70% in Slovenia and 100% in Romania. Hungary charges nine times the minimum wage a year, Poland 40.65% of the average wage a month.'],
    ['In most quota countries the levy can be offset by purchases.','By ordering from sheltered workshops or social enterprises in Bulgaria, Czechia, Germany, Spain, France, Croatia, Poland, Slovenia and Slovakia, and for up to half of the levy in Romania. Hungary has no such option.'],
    ['Few employers meet the quota.','22% of obliged employers comply in Austria, 18% in Luxembourg, 40% in Spain; in Hungary 30–35% of quota places are filled. Quotas without sanctions have practically no effect.'],
    ['In sheltered employment, legal status is the dividing line.','Workers have employee status and the minimum wage in Spain, the Netherlands, Flanders, Sweden and Slovenia. People work without an employment contract in Austrian provincial workshops, German WfbM and French ESAT.'],
    ['Few people move from sheltered workshops to the open labour market.','0.7% in Austria, under 1% in Germany, 2% or less from Polish therapy workshops and Estonian long-term sheltered work. Schemes designed for transition do better but fall short of their goals: 3.6–7.7% in France against a 30% goal, about 20% from the Estonian short-term service.'],
    ['Few countries measure themselves on the employment rate.','About 15 countries have or had some numerical target. Belgium, Latvia, Poland, Romania, Spain and (as a ranking) Portugal have a current target for the employment or activity rate of people with disabilities or for the gap; the Irish target expired in 2024 and the Lithuanian one was dropped. The others track a narrower group or a different indicator. Hungary has no target.'],
    ['The effect of wage subsidies is poorly evidenced.','They are the main tool in countries without a quota, but where evaluations exist (Finland, Latvia, Denmark) the effect is modest or not measurable.'],
    ['Workplace adaptation grants are hardly used.','13–16 cases a year in Estonia, 125 workplaces in Lithuania (2021), 37 applications in Ireland (2019).']
  ],
  me_h:'Sources and reliability',
  me:[
    '<p><b>Regions.</b> The region filter follows EuroVoc, the thesaurus of the EU Publications Office: Central and Eastern Europe (BG, CZ, HR, HU, PL, RO, SI, SK), Northern Europe (DK, EE, FI, LT, LV, SE), Western Europe (AT, BE, DE, FR, IE, LU, NL), Southern Europe (CY, EL, ES, IT, MT, PT). The UN M49 scheme differs: it puts Croatia and Slovenia in Southern Europe, Ireland in Northern Europe and Cyprus in Western Asia.</p>',
    '<p><b>Two source levels.</b> For the 15 countries marked “checked against recent national sources”, the main statements were checked against national or professional sources from 2024–2026. For the other 12, the profile rests on the EDE network’s 2022 and 2024 country reports and the Commission’s DOTCOM database as of October 2025; for these, key figures (wage subsidies, quota, recent reforms) were checked and updated against national sources in November 2026, as the source label under each block shows.</p><p><b>A uniform layer.</b> How the quota works in practice and the national target come from the 2024 EDE country report for all 27 countries (as of November 2024), so they can be compared. For planned reforms and notes, more recent national data take precedence.</p>',
    '<p><b>Moving to the open labour market.</b> This block answers two questions: is there an instrument designed to lead people out of sheltered employment (for example a stepping-stone contract, a placement allowance or a right to return), and is any measured outcome published. The rates cannot be compared directly: some countries measure yearly exits from the whole workforce (AT, DE), some the share of programme leavers who find work (EE, FR, MT), and some head counts (SE, SK). The Hungarian “transit employment” is a legal category, not a measure of transitions that actually happen. “None known” means that neither the EDE report nor the November 2026 search of national sources found such an instrument.</p>',
    '<p><b>Keep in mind.</b> Levy and subsidy amounts change every year. “Sheltered employment” means different institutions in different countries (therapy workshops, sheltered enterprises, accredited employers, social enterprises), so headcounts indicate scale only. Where sources contradict each other, the profile is flagged as being checked.</p><p><b>Practical layer.</b> The “What is available in this country?” list, the “What is available where?” table and the stability rating are our own summary of the DOTCOM database (public employment services, workplace adaptations, financial incentives; October 2025) and the EDE reports. The “Where to turn” websites were checked for availability on 15–17 November 2026. The description of who counts towards the quota is an informative summary, not legal advice.</p><p>Profiles as of {UPD}. This is our own compilation, not official legal information.</p>'
  ],
  foot:'<b>Comparative sources:</b><ul>'+

  var l=L(), rows=list(), ks=['ws','tr','se','ad','buy'];
  $('mx_leg').innerHTML=['y','p','n','x'].map(function(v){return '<span style="display:inline-flex;align-items:center;gap:7px">'+stIc(v)+l.qv[v]+'</span>';}).join('');
  var h='<thead><tr><th scope="col">'+l.th[0]+'</th>'+ks.concat(['st']).map(function(k){return '<th scope="col">'+l.qkS[k]+'</th>';}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(g){var x=P[g].x;
    h+='<tr data-g="'+g+'"'+(g===st.geo?' class="sel"':'')+'><td class="c1"><button type="button">'+esc(nm(g))+'</button></td>'+
      ks.map(function(k){return '<td><span class="mb">'+stIc(x[k])+l.qv[x[k]]+'</span></td>';}).join('')+
      '<td><span class="mb">'+stIc(x.st==='s'?'y':x.st==='m'?'p':'n')+l.qst[x.st]+'</span></td></tr>';});
  $('mx').innerHTML=h+'</tbody>';
  $('mx').querySelectorAll('tbody tr').forEach(function(tr){tr.addEventListener('click',function(){st.geo=tr.getAttribute('data-g');$('geo').value=st.geo;update();toProfile();});});
}
function update(){
  document.querySelectorAll('#mf button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-m')===st.mf);});
  document.querySelectorAll('#models button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-m')===st.mf);});
  markMap();renderMini();renderProfile();renderTable();renderMatrix();scrollable();
  var rg=st.reg==='all'?'':'-'+st.reg;
  $('navD').href='index.html#'+st.geo+'-0-T-'+st.lang+rg;
  try{history.replaceState(null,'','#'+st.geo+'-'+st.lang+rg);}catch(e){}
}
function step(d){var a=list(), k=a.indexOf(st.geo); st.geo=a[(k+d+a.length)%a.length]; $('geo').value=st.geo; update();}

document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){st.lang=b.getAttribute('data-lang');renderStatic();update();});});
$('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');renderStatic();update();});
$('geo').addEventListener('change',function(e){pick(e.target.value);});
document.querySelectorAll('#reg button').forEach(function(b){b.addEventListener('click',function(){setReg(b.getAttribute('data-reg'));});});
['prev','prev2'].forEach(function(i){$(i).addEventListener('click',function(){step(-1);});});
['next','next2'].forEach(function(i){$(i).addEventListener('click',function(){step(1);});});
document.querySelectorAll('#sort button').forEach(function(b){b.addEventListener('click',function(){st.sort=b.getAttribute('data-s');renderTable();renderMatrix();});});
document.querySelectorAll('#dense button').forEach(function(b){b.addEventListener('click',function(){st.dense=b.getAttribute('data-d')==='1';renderTable();});});
// sticky bar height drives the sticky table header and scroll offsets
function barH(){var c=$('controls'), h=getComputedStyle(c).position==='sticky'?c.offsetHeight:0; document.documentElement.style.setProperty('--ch',h+'px');}
if(window.ResizeObserver) new ResizeObserver(barH).observe($('controls')); window.addEventListener('resize',barH);
// scrollable tables must be reachable by keyboard
function scrollable(){['tblw','mxw'].forEach(function(id){var w=$(id), o=w.scrollWidth>w.clientWidth+1; if(o){w.setAttribute('tabindex','0');w.setAttribute('role','region');w.setAttribute('aria-label',id==='tblw'?L().tb_h:L().mx_h);}else{w.removeAttribute('tabindex');w.removeAttribute('role');w.removeAttribute('aria-label');}});}
window.addEventListener('resize',scrollable);
var spyT=null;
function spy(){ if(spyT) return; spyT=requestAnimationFrame(function(){spyT=null;
  var off=(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ch'))||0)+40, cur=null;
  document.querySelectorAll('#jump a').forEach(function(a){var s=$(a.getAttribute('data-j')); if(s&&s.getBoundingClientRect().top<=off) cur=a;});
  document.querySelectorAll('#jump a').forEach(function(a){ if(a===cur) a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current');});});}
window.addEventListener('scroll',spy,{passive:true});

// Refresh the employment figures from the Data page when both are served from the same site.
function fromSnapshot(D){
  var Y=D.years,S=D.series,o={};
  function v(k,g,i){var t=S[k]&&S[k][g]?S[k][g][i]:null; var m=t==null?null:/^(-?[\d.]+)/.exec(t); return m?+m[1]:null;}
  GEOS.forEach(function(g){ for(var i=Y.length-1;i>=0;i--){
    var a=v('silc.EMP.SM_SEV.T',g,i), b=v('silc.POP.SM_SEV.T',g,i), G=v('gap.SM_SEV.T',g,i);
    if(a==null||b==null||G==null||b-a<1) continue;
    a/=100;b/=100; var d=a*G*(1-b)/(b-a), e=b*d+(1-b)*(d+G);
    o[g]={y:Y[i],d:d,L:e-d}; break; }});
  return o;
}
if(window.fetch&&location.protocol.indexOf('http')===0){
  fetch('index.html').then(function(r){return r.ok?r.text():null;}).then(function(t){
    if(!t) return; var m=/<script id="snapshot" type="application\/json">([\s\S]*?)<\/script>/.exec(t); if(!m) return;
    var o=fromSnapshot(JSON.parse(m[1])); if(Object.keys(o).length){EMP=o;renderProfile();}
  }).catch(function(){});
}

buildMap();renderStatic();update();barH();scrollable();
})();
</script>
